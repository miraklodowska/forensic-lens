<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Forensic Lens</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg:#fff; --fg:#111827; --muted:#6b7280; --line:#e5e7eb;
        --accent:#1d4ed8; --ok:#047857; --bad:#b91c1c;
      }
      @media (prefers-color-scheme: dark) {
        :root { --bg:#111827; --fg:#f3f4f6; --muted:#9ca3af; --line:#374151;
                --accent:#60a5fa; --ok:#34d399; --bad:#f87171; }
      }
      * { box-sizing: border-box; }
      body { width:320px; margin:0; padding:14px; background:var(--bg); color:var(--fg);
             font:13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
      h1 { margin:0 0 2px; font-size:14px; }
      .sub { margin:0 0 12px; color:var(--muted); font-size:11px; }
      .row { display:flex; align-items:center; justify-content:space-between; gap:10px;
             padding:8px 0; border-top:1px solid var(--line); }
      .row:first-of-type { border-top:none; }
      label { display:flex; align-items:center; gap:8px; cursor:pointer; }
      .status { display:flex; align-items:center; gap:6px; font-size:12px; }
      .dot { width:8px; height:8px; border-radius:50%; background:var(--muted); flex:none; }
      .dot.ready { background:var(--ok); }
      .dot.error { background:var(--bad); }
      .pill { font:600 10px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
              padding:3px 6px; border-radius:5px; border:1px solid var(--line); color:var(--muted); }
      input[type="range"] { width:130px; }
      .val { font:600 12px ui-monospace, SFMono-Regular, Menlo, monospace; min-width:34px; text-align:right; }
      .stats { display:flex; gap:16px; color:var(--muted); font-size:11px; }
      .stats b { color:var(--fg); font-size:13px; display:block; }
      .note { margin-top:10px; color:var(--muted); font-size:10.5px; line-height:1.45; }
      .err { color:var(--bad); font-size:11px; margin-top:6px; word-break:break-word; }
    </style>
  </head>
  <body>
    <h1>Forensic Lens</h1>
    <p class="sub">On-device AI image detection</p>

    <div class="row">
      <span class="status"><span class="dot" id="dot"></span><span id="engine">starting…</span></span>
      <span class="pill" id="backend">—</span>
    </div>
    <div class="row"><label><input type="checkbox" id="enabled" /> Analyse images automatically</label></div>
    <div class="row">
      <label for="threshold">Flag at</label>
      <span style="display:flex; align-items:center; gap:8px">
        <input type="range" id="threshold" min="1" max="99" step="1" />
        <span class="val" id="thresholdVal">65%</span>
      </span>
    </div>
    <div class="row"><label><input type="checkbox" id="showBadges" /> Show score badges</label></div>
    <div class="row"><label><input type="checkbox" id="blurFlagged" /> Blur flagged images</label></div>
    <div class="row">
      <div class="stats">
        <span><b id="analyzed">0</b>analysed</span>
        <span><b id="flagged">0</b>flagged</span>
        <span><b id="errors">0</b>errors</span>
      </div>
    </div>

    <p class="note">
      Images are decoded and scored inside this browser. Nothing is uploaded, and the
      extension makes no network requests once installed.
    </p>
    <p class="err" id="error" hidden></p>

    <script type="module" src="popup.js"></script>
  </body>
</html>
